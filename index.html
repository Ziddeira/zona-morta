<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zona Morta — Protótipo</title>
<script type="importmap">{ "imports": { "three": "./three.module.min.js" } }</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d0c;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eee;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer}
/* aviso de girar */
#rotate{position:fixed;inset:0;z-index:100;background:#0b0d0c;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
#rotate .ph{width:60px;height:100px;border:4px solid #9c6;border-radius:12px;animation:rot 1.8s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
/* tela inicial */
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#1d2a1b 0,#0b0d0c 70%)}
#title h1{margin:0;font-size:min(13vh,64px);letter-spacing:4px;color:#b6e36b;text-shadow:0 4px 0 #2b3d17,0 0 30px #5d8a2a88}
#title p{margin:0;color:#9aa;font-size:14px}
.btn{background:#3d5f22;border-bottom:4px solid #24391a;padding:12px 26px;border-radius:12px;font-weight:700;font-size:17px;min-width:200px}
.btn.sec{background:#3a3f45;border-bottom-color:#22262a}
.btn.red{background:#7a2b23;border-bottom-color:#4b1813}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn:disabled{opacity:.4}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud .pe{pointer-events:auto}
.tl{position:absolute;left:max(10px,env(safe-area-inset-left));top:8px;display:flex;flex-direction:column;gap:5px}
.tc{position:absolute;left:50%;top:8px;transform:translateX(-50%);text-align:center}
.tr{position:absolute;right:max(10px,env(safe-area-inset-right));top:8px;display:flex;gap:6px;align-items:flex-start}
.chip{background:#000a;border:1px solid #fff2;border-radius:10px;padding:5px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.bar{width:170px;height:14px;background:#000a;border:1px solid #fff3;border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(#e44,#a22);width:100%;transition:width .15s}
#wave{font-size:15px;font-weight:800;text-shadow:0 2px 3px #000;padding:6px 14px}
#wave small{display:block;font-weight:600;font-size:11px;color:#ccc}
#xbar{width:260px;height:12px;margin:4px auto 0}
#xbar>i{background:linear-gradient(#5ef,#29a)}
/* controles direita */
.br{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:14px;display:grid;grid-template-columns:auto auto;gap:10px;align-items:end;justify-items:center}
.cbtn{width:62px;height:62px;border-radius:50%;background:#000a;border:2px solid #fff4;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;line-height:1;position:relative}
.cbtn small{font-size:10px;font-weight:700;margin-top:3px}
.cbtn.big{width:84px;height:84px;background:#3d5f22d0;border-color:#b6e36b;font-size:13px;font-weight:800;text-align:center;padding:4px}
.cbtn.big.off{background:#0007;border-color:#fff3;color:#fff6}
.cbtn .cnt{position:absolute;top:-4px;right:-4px;background:#c33;border-radius:9px;font-size:11px;padding:1px 6px;font-weight:800}
.prog{position:absolute;inset:-5px;border-radius:50%;border:5px solid transparent}
#weapon{width:auto;min-width:96px;height:52px;border-radius:12px;font-size:12px;font-weight:700;padding:0 10px}
/* joystick */
#joyzone{position:absolute;left:0;bottom:0;width:50%;height:78%;pointer-events:auto}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid #fff4;background:#fff1;display:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fff5}
/* indicadores */
.ind{position:absolute;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid #f43;filter:drop-shadow(0 0 3px #000)}
#hurt{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 40px #c00;opacity:0;transition:opacity .25s;z-index:9}
#toast{position:fixed;left:50%;top:34%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#000c;border:1px solid #fff3;padding:7px 14px;border-radius:10px;font-weight:700;font-size:14px;animation:fade 2.6s forwards}
@keyframes fade{0%{opacity:0;transform:translateY(8px)}10%,75%{opacity:1;transform:none}100%{opacity:0}}
/* painel */
#panel{position:fixed;inset:0;z-index:40;background:#000a;display:flex;align-items:center;justify-content:center;padding:10px}
#panel .box{background:#171b19;border:1px solid #2d3a2a;border-radius:16px;width:min(860px,96vw);max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
#panel .hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #2d3a2a;background:#1d2420}
#panel .hd h2{margin:0;font-size:18px;flex:1}
#panel .x{background:#3a3f45;border-radius:10px;width:38px;height:34px;font-size:18px}
#panel .bd{padding:12px 14px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#panel .ft{padding:10px 14px;border-top:1px solid #2d3a2a;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.card{background:#202723;border:1px solid #2f3b31;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.card.sel{border-color:#b6e36b;box-shadow:0 0 0 2px #b6e36b55}
.card.lock{opacity:.45}
.card h3{margin:0;font-size:15px}
.card .s{font-size:12px;color:#aab}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sb{background:#3d5f22;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}
.sb.g{background:#3a3f45}.sb.r{background:#7a2b23}
.sb:disabled{opacity:.35}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:#2a302c;border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px}
.tabs button.on{background:#3d5f22}
.it{display:flex;align-items:center;gap:8px;background:#202723;border-radius:10px;padding:6px 8px;font-size:13px}
.it b{flex:1;font-weight:600}
.step{display:flex;align-items:center;gap:4px}
.step button{width:30px;height:28px;border-radius:7px;background:#3a3f45;font-weight:800}
.step span{min-width:24px;text-align:center;font-weight:800}
.money{color:#ffd45e;font-weight:800}
.muted{color:#8a9;font-size:12px}
h4{margin:12px 0 6px;font-size:13px;color:#b6e36b;text-transform:uppercase;letter-spacing:.5px}
select{background:#2a302c;color:#eee;border:1px solid #3d4a40;border-radius:8px;padding:6px;font:inherit;font-size:13px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="rotate"><div class="ph"></div><b>Gire o celular</b><span style="color:#9aa">Este jogo é jogado na horizontal.</span></div>

<div id="title">
  <h1>ZONA MORTA</h1>
  <p>Protótipo · extração, hordas e QG</p>
  <button class="btn" id="bPlay">Jogar</button>
  <button class="btn sec" id="bNew">Novo jogo</button>
</div>

<div id="hud" class="hidden">
  <div id="joyzone"><div id="joy"><div id="knob"></div></div></div>
  <div class="tl" id="hudTL"></div>
  <div class="tc" id="hudTC"></div>
  <div class="tr" id="hudTR"></div>
  <div class="br" id="hudBR"></div>
  <div id="inds"></div>
</div>
<div id="hurt"></div>
<div id="toast"></div>
<div id="panel" class="hidden"><div class="box"><div class="hd"><h2 id="pTitle"></h2><button class="x" id="pClose">✕</button></div><div class="bd" id="pBody"></div><div class="ft" id="pFoot"></div></div></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
